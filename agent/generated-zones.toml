# Generated zones for jankurai-tools-dedup.
# The only generated output tree in this single-purpose Rust crate repo is
# target/, produced by Cargo. It is never hand-edited and is regenerated by the
# build.

[[zone]]
path = "target/"
source = "crates/jankurai-audit-dedup (Cargo workspace)"
command = "cargo build --workspace --locked"
read_only = true
write_policy = "generated_output"
